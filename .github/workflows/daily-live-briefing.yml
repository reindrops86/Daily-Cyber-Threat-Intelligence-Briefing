name: Daily Live CTI Briefing

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-live-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run live briefing against CISA KEV and NVD
        run: python -m app.main live
      - uses: actions/upload-artifact@v4
        with:
          name: daily-live-cti-briefing
          path: |
            reports/live-*.md
            data/state.json
          if-no-files-found: error
      - name: Commit changed live artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-*.md data/state.json
          git diff --cached --quiet || git commit -m "Generate daily live CTI briefing"
          git pull --rebase
          git push
